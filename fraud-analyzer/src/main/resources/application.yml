server:
  port: 8081

spring:
  application:
    name: fraud-analyzer
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

fraud:
  analyzer:
    weights:
      velocity: 0.25
      blacklist: 0.30
      geolocation: 0.20
      time-based: 0.15
      amount-anomaly: 0.20
      device-fingerprint: 0.10
      merchant-pattern: 0.10
      ip-velocity: 0.15
