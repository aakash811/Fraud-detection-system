apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection
---
apiVersion: secretmanager.example.com/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: db-secret
  data:
  - secretKey: username
    remoteRef:
      key: fraud-detection/postgres
      property: username
  - secretKey: password
    remoteRef:
      key: fraud-detection/postgres
      property: password